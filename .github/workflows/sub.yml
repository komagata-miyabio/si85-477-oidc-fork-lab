name: show-oidc-sub
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: print sub claim
        run: |
          echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF repo=$GITHUB_REPOSITORY"
          echo "base_ref=$GITHUB_BASE_REF head_ref=$GITHUB_HEAD_REF"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "RESULT: NO_ID_TOKEN_REQUEST_URL (id-token not granted)"; exit 0
          fi
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then echo "RESULT: TOKEN_REQUEST_FAILED"; exit 0; fi
          P=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#P} % 4 )) -ne 0 ]; do P="${P}="; done
          echo "RESULT:"
          echo "$P" | base64 -d | jq '{sub, event_name, ref, base_ref, head_ref, repository, repository_id, repository_owner, workflow_ref}'
